[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowagent-backend"
version = "0.5.0"
description = "FlowAgent backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "lark-oapi>=1.7.3,<2",
  "pgvector>=0.3,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pycryptodome>=3.20,<4",
  "pypdf>=5,<7",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
